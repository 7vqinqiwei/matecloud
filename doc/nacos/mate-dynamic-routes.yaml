routes:
  # mate-uaa
  - id: mate-uaa
    predicates:
      - name: Path
        args:
          _genkey_0: /mate-uaa/**
    filters:
      - name: StripPrefix
        args:
          _genkey_0: 1
    uri: lb://mate-uaa-starter
    order: 0
  # mate-system
  - id: mate-system
    predicates:
      - name: Path
        args:
          _genkey_0: /mate-system/**
    filters:
      - name: RequestRateLimiter
        args:
          # 限流策略
          key-resolver: '#{@remoteAddrKeyResolver}'
          # 令牌桶每秒填充率
          redis-rate-limiter.burstCapacity: 20
          # 令牌桶容量
          redis-rate-limiter.replenishRate: 20
      - name: StripPrefix
        args:
          _genkey_0: 1
    uri: lb://mate-system-starter
    order: 0
  # mate-component
  - id: mate-component
    predicates:
      - name: Path
        args:
          _genkey_0: /mate-component/**
    filters:
      - name: StripPrefix
        args:
          _genkey_0: 1
    uri: lb://mate-component-starter
    order: 0
  # mate-code
  - id: mate-code
    predicates:
      - name: Path
        args:
          _genkey_0: /mate-code/**
    filters:
      - name: StripPrefix
        args:
          _genkey_0: 1
    uri: lb://mate-code-starter
    order: 0
