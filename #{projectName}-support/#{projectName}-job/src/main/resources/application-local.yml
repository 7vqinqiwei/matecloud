server:
  port: 30006
spring:
  application:
    name: @artifactId@
  #数据源配置
  datasource:
    url: ${#{projectName}.datasource.url}
    username: ${#{projectName}.datasource.username}
    password: ${#{projectName}.datasource.password}
logging:
  config: classpath:logback.xml
#{projectName}:
  job:
    admin:
      addresses: http://localhost:30008/
    accessToken: ''
    executor:
      appname: ${spring.application.name}
      address: 127.0.0.1:30007
      ip: 127.0.0.1
      port: 30007
      logPath: logs/app/#{projectName}-job/jobhandler/
      logRetentionDays: 30

